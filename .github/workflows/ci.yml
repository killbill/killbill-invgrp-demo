name: ci

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  ci:
    uses: killbill/gh-actions-shared/.github/workflows/ci.yml@java21

  integration_test:
    uses: killbill/gh-actions-shared/.github/workflows/integration_test.yml@java21
    with:
      plugin_name: 'invgrp'
      integration_tests_goal: 'test:plugins:invgrp'
      test-goal-java: 'test verify'